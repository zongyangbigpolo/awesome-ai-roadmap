site_name: Awesome AI Roadmap
site_description: AI engineering interview preparation covering LLMs, multimodal AI, tools, agents, RAG, frameworks, LLMOps, safety, and forward-deployed engineering.
site_author: Polo Li
site_url: https://zongyangbigpolo.github.io/awesome-ai-roadmap/
repo_url: https://github.com/zongyangbigpolo/awesome-ai-roadmap
repo_name: zongyangbigpolo/awesome-ai-roadmap
edit_uri: edit/main/docs/

theme:
  name: material
  custom_dir: overrides
  language: en
  features:
    - content.code.copy
    - content.action.edit
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.tabs
    - navigation.top
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - i18n:
      docs_structure: suffix
      fallback_to_default: false
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          name: English
          default: true
          build: true
        - locale: zh
          name: 简体中文
          build: true
          site_name: AI 工程学习路线
          site_description: 面向 AI 工程面试准备，梳理 LLM、多模态、Tools、Agent、RAG、框架、LLMOps、安全治理与 FDE 的原理和工程取舍
          theme:
            palette:
              - toggle:
                  name: 切换到深色模式
              - toggle:
                  name: 切换到浅色模式
          nav_translations:
            Book: 书稿
            About: 关于
            LLM: LLM
            Foundations: 基础原理
            Training and alignment: 训练与对齐
            Inference and serving: 推理与部署
            Prompting and reliability: Prompt 与可靠性
            Evaluation and selection: 评测与选型
            Multimodal: 多模态
            Multimodal AI: 多模态 AI
            Foundations and architecture: 基础与架构
            Vision and document intelligence: 视觉与文档智能
            Speech and audio: 语音与音频
            Multimodal generation: 多模态生成
            Training, evaluation, and serving: 训练、评测与服务
            Tools: 工具
            Function Calling: Function Calling
            MCP: MCP
            Skills: Skills
            Agent communication: Agent 通信
            Transports and gateways: 传输与网关
            Agents: Agent
            Runtime and harness: Runtime 与 Harness
            Reasoning, planning, and reflection: 推理、规划与反思
            Memory and context: 记忆与上下文
            Multi-agent systems: 多智能体系统
            Evaluation and safety: 评估与安全
            Coding agents: Coding Agent 工程
            Agent post-training: Agent 后训练
            RAG: RAG
            Foundations and selection: 基础与选型
            Ingestion and indexing: 摄取与索引
            Online retrieval: 在线检索
            Advanced and multimodal RAG: 高级与多模态
            Generation and evaluation: 生成与评估
            Operations and security: 运维与安全
            Structured queries: 结构化查询
            Frameworks and orchestration: 框架与编排
            LangChain ecosystem: LangChain 生态
            Core architecture: 基础架构
            Building agents: Agent 构建
            Ecosystem and evolution: 生态与演进
            LangGraph: LangGraph
            Production feedback loop: 生产闭环
            LlamaIndex: LlamaIndex
            DSPy: DSPy
            Semantic Kernel: Semantic Kernel
            Lightweight agent frameworks: 轻量级 Agent 框架
            Selection and portability: 选型与可移植架构
            AI Engineering: AI 工程
            Foundations and production architecture: 基础与生产架构
            Request reliability: 请求路径可靠性
            Output quality and safety: 输出质量与安全
            Evaluation and observability: 评测与可观测性
            Versioning and releases: 版本管理与发布
            Performance, cost, and operations: 性能、成本与运营
            AI safety and governance: AI 安全与治理
            Threat modeling: 威胁建模
            Prompt and content attacks: 提示与内容层攻击
            Data and model supply chains: 数据与模型供应链
            Agents and execution environments: Agent 与执行环境
            Evaluation, governance, and assurance: 评测、治理与保障
            FDE: FDE
            Foundations and delivery: 基础与交付方法
            Field practice and lessons: 现场经验与踩坑
  - search:
      lang:
        - en
        - zh
  - git-revision-date-localized:
      type: iso_date
      timezone: Asia/Shanghai
      locale: en
      enable_creation_date: true
      enable_git_follow: false
      strict: true
  - redirects:
      redirect_maps:
        langchain/README.md: frameworks/01-langchain/README.md
