        langchain/04-langgraph/10-langgraph-advantages.md: frameworks/01-langchain/04-langgraph/10-langgraph-advantages.md
        langchain/05-production/README.md: frameworks/01-langchain/05-production/README.md
        langchain/05-production/12-deep-research.md: frameworks/01-langchain/05-production/12-deep-research.md
        langchain/05-production/13-langsmith-production-loop.md: frameworks/01-langchain/05-production/13-langsmith-production-loop.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

extra_css:
  - stylesheets/extra.css

hooks:
  - scripts/mkdocs_hooks.py

extra:
  author:
    name: Polo Li
    url: https://github.com/zongyangbigpolo
  seo:
    google_site_verification: "Tbgg-w7R1iywQ8r0Mp868731_XNo6up5vWyclB5GVBw"
